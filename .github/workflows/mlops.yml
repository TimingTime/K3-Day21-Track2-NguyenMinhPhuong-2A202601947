name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      threshold: ${{ steps.read_metrics.outputs.threshold }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to AWS
        env:
          AWS_CREDENTIALS_JSON: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["AWS_CREDENTIALS_JSON"])
          required = ("aws_access_key_id", "aws_secret_access_key")
          missing = [name for name in required if not credentials.get(name)]
          if missing:
              raise SystemExit(f"CLOUD_CREDENTIALS is missing: {', '.join(missing)}")

          values = {
              "AWS_ACCESS_KEY_ID": credentials["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": credentials["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": credentials.get("region", "us-east-1"),
          }
          if credentials.get("aws_session_token"):
              values["AWS_SESSION_TOKEN"] = credentials["aws_session_token"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Configure DVC remote
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: dvc remote add --force -d myremote "s3://${CLOUD_BUCKET}/dvc"

      - name: Pull training and evaluation data
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACCURACY=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          THRESHOLD=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['eval_threshold'])")
          echo "accuracy=${ACCURACY}" >> "$GITHUB_OUTPUT"
          echo "threshold=${THRESHOLD}" >> "$GITHUB_OUTPUT"

      - name: Save model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.pkl
          if-no-files-found: error

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt
          if-no-files-found: error

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check accuracy gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          THRESHOLD: ${{ needs.train.outputs.threshold }}
        run: |
          python - <<'PY'
          import os

          accuracy = float(os.environ["ACCURACY"])
          threshold = float(os.environ["THRESHOLD"])
          print(f"Accuracy: {accuracy:.4f}; required: {threshold:.2f}")
          if accuracy < threshold:
              raise SystemExit("Evaluation failed; deployment has been blocked.")
          print("Evaluation passed; model is ready for deployment.")
          PY

      - name: Authenticate to AWS
        env:
          AWS_CREDENTIALS_JSON: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["AWS_CREDENTIALS_JSON"])
          values = {
              "AWS_ACCESS_KEY_ID": credentials["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": credentials["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": credentials.get("region", "us-east-1"),
          }
          if credentials.get("aws_session_token"):
              values["AWS_SESSION_TOKEN"] = credentials["aws_session_token"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Compare with currently deployed model
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          if aws s3api head-object \
            --bucket "${CLOUD_BUCKET}" \
            --key "models/latest/metrics.json" \
            > /dev/null 2> head-object-error.txt; then
            aws s3 cp \
              "s3://${CLOUD_BUCKET}/models/latest/metrics.json" \
              previous_metrics.json
            python - <<'PY'
          import json
          import os

          new_accuracy = float(os.environ["ACCURACY"])
          with open("previous_metrics.json", encoding="utf-8") as file:
              current_accuracy = float(json.load(file)["accuracy"])

          print(
              f"New accuracy: {new_accuracy:.4f}; "
              f"deployed accuracy: {current_accuracy:.4f}"
          )
          if new_accuracy < current_accuracy:
              raise SystemExit(
                  "New model is worse than the deployed model; deployment blocked."
              )
          print("New model is not worse than the deployed model.")
          PY
          elif grep -Eq "404|Not Found|NoSuchKey" head-object-error.txt; then
            echo "No deployed metrics found; allowing the first versioned deploy."
          else
            cat head-object-error.txt
            echo "Unable to read deployed metrics; deployment blocked for safety."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Download approved metrics and report
        uses: actions/download-artifact@v4
        with:
          name: metrics
          path: outputs

      - name: Authenticate to AWS
        env:
          AWS_CREDENTIALS_JSON: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["AWS_CREDENTIALS_JSON"])
          required = ("aws_access_key_id", "aws_secret_access_key")
          missing = [name for name in required if not credentials.get(name)]
          if missing:
              raise SystemExit(f"CLOUD_CREDENTIALS is missing: {', '.join(missing)}")

          values = {
              "AWS_ACCESS_KEY_ID": credentials["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": credentials["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": credentials.get("region", "us-east-1"),
          }
          if credentials.get("aws_session_token"):
              values["AWS_SESSION_TOKEN"] = credentials["aws_session_token"]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Promote approved model to Amazon S3
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          aws s3 cp models/model.pkl \
            "s3://${CLOUD_BUCKET}/models/latest/model.pkl"
          aws s3 cp outputs/metrics.json \
            "s3://${CLOUD_BUCKET}/models/latest/metrics.json"
          aws s3 cp outputs/report.txt \
            "s3://${CLOUD_BUCKET}/models/latest/report.txt"

      - name: Restart API service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd "$HOME/mlops-lab"
            git pull --ff-only origin main
            ./.venv/bin/python -m pip install -r requirements.txt
            sudo systemctl restart mlops-serve
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for API (attempt ${attempt}/6)..."
              sleep 5
            done
            echo "Health check failed."
            sudo systemctl status mlops-serve --no-pager || true
            exit 1
